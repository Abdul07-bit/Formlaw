# Development stack: PostgreSQL + pgvector, MinIO object storage, FastAPI backend, Vite frontend.
#   cp .env.example .env    # fill in JWT_SECRET, FILE_ENCRYPTION_KEY, POSTGRES_PASSWORD
#   docker compose up --build
# Secrets come from .env; nothing sensitive is hard-coded here.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: formlaw
      POSTGRES_USER: formlaw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formlaw"]
      interval: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-formlaw}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes: [objects:/data]
    ports: ["9000:9000", "9001:9001"]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://formlaw:${POSTGRES_PASSWORD}@db:5432/formlaw
      STORAGE_DIR: /data/storage
    depends_on:
      db: { condition: service_healthy }
    volumes: [uploads:/data/storage]
    ports: ["8000:8000"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes: [".:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  objects:
  uploads:
